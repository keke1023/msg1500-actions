name: Build MSG1500 X.00 (coolsnowwolf/lede)

on:
  workflow_dispatch:
    inputs:
      wifi_driver:
        description: "MT7615 无线驱动"
        required: false
        default: "mt7615d"
        type: choice
        options:
          - mt7615d   # 闭源 mt_wifi（lede 自带 package/lean/mt）
          - mt7615e   # 开源 mt76（lede 自带 kmod-mt7615e，兜底用）

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # ---- 底座：coolsnowwolf/lede 的稳定发布快照（日期 tag）----
  # 20251001 = 内核 5.10 + opkg + 自带 golang 1.27 + 自带闭源驱动 + helloworld 为可选 feed
  # 选它的理由（详见 README）：
  #   * 自带 kmod-mt7615d + luci-app-mtwifi，无需跨代注入
  #   * 自带 golang 1.27，够 helloworld master 的 xray-core 26.x（go>=1.26），无需跨代覆盖
  #   * 仍是 opkg，构建系统稳定；比 lede master（切内核 6.18/APK）可靠
  LEDE_TAG: "20251001"
  HELLOWORLD_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    name: ramips/mt7621 · raisecom_msg1500-x-00
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 磁盘清理
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                       /usr/local/share/boost /usr/local/share/chromium /usr/local/julia* 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl ca-certificates

      - name: 拉取 coolsnowwolf/lede @ ${{ env.LEDE_TAG }}
        run: |
          # 直接 -b 指定 tag 克隆，一步到位（避免 clone master 后再 fetch/checkout tag 因浅克隆无本地 ref 而失败）
          git clone -b "$LEDE_TAG" --depth 1 https://github.com/coolsnowwolf/lede.git openwrt
          git -C openwrt log -1 --format="lede HEAD: %H %cd" --date=iso

      - name: 启用 helloworld(master) feed
        run: bash scripts/10-add-feeds.sh

      - name: 剔除 rust 相关包
        run: bash scripts/30-remove-rust.sh

      - name: 安装全部 feeds
        working-directory: openwrt
        run: ./scripts/feeds install -a

      - name: 写入 .config 并按驱动模式调整
        working-directory: openwrt
        run: |
          # 解耦开源固件包对 mt7615e 驱动的强制依赖：
          # kmod-mt7615-firmware 的 `DEPENDS+=+kmod-mt7615e` 会让 make defconfig 把开源驱动也拉进来，
          # 与闭源 kmod-mt7615d 抢同一 PCI 设备导致内核冲突。MT7615 固件 bin 两驱动共用，
          # 保留固件包、去掉该依赖即可，固件文件照常落盘。
          sed -i '/define KernelPackage\/mt7615-firmware/,/^endef/{/DEPENDS+=+kmod-mt7615e/d}' package/kernel/mt76/Makefile

          cp ../config/msg1500-x00.config .config
          if [ "${{ github.event.inputs.wifi_driver }}" = "mt7615e" ]; then
            # 开源模式：去掉闭源驱动与 mtwifi，改挂 kmod-mt7615e + 固件
            sed -i '/CONFIG_PACKAGE_kmod-mt7615d=/d' .config
            sed -i '/CONFIG_PACKAGE_luci-app-mtwifi=/d' .config
            echo "CONFIG_PACKAGE_kmod-mt7615e=y" >> .config
            echo "CONFIG_PACKAGE_kmod-mt7615-firmware=y" >> .config
          fi
          # 强制 host node 用 v18（python3 + gcc11 兼容），绕开 lede 默认 v12 的 py2 死穴
          echo "CONFIG_NODEJS_18=y" >> .config
          make defconfig
          # 双保险：闭源模式下确保开源驱动符号不存在（避免与 mt7615d 冲突）
          if [ "${{ github.event.inputs.wifi_driver }}" != "mt7615e" ]; then
            sed -i '/CONFIG_PACKAGE_kmod-mt7615e=/d' .config
          fi

      - name: 校验配置（设备 / rust / 驱动 / 版本）
        working-directory: openwrt
        run: |
          set -e
          grep -q "^CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_raisecom_msg1500-x-00=y" .config \
            || grep -q "^CONFIG_TARGET_ramips_mt7621_DEVICE_raisecom_msg1500-x-00=y" .config \
            || { echo "!! 目标设备未选中"; exit 1; }
          if grep -E "^CONFIG_PACKAGE_.*([Rr]ust|shadow-tls)=y" .config; then
            echo "!! 仍有 rust 相关包被选中"; exit 1
          fi
          # 闭源(kmod-mt7615d) 与开源(kmod-mt7615e) 驱动互斥，不能同时加载同一 PCI 设备
          if grep -q "^CONFIG_PACKAGE_kmod-mt7615d=y" .config && grep -q "^CONFIG_PACKAGE_kmod-mt7615e=y" .config; then
            echo "!! kmod-mt7615d 与 kmod-mt7615e 同时选中，会内核冲突，已自动规避（见写入步骤）"; exit 1
          fi
          echo "--- 已选中的关键包 ---"
          grep -E "^CONFIG_PACKAGE_(luci-app-ssr-plus|luci-app-frpc|luci-app-ngrokc|xray-core|kmod-mt7615[de]|luci-app-mtwifi)=" .config || true
          echo "--- golang 版本 ---"
          grep -E "GO_VERSION_MAJOR_MINOR" feeds/packages/lang/golang/golang/Makefile 2>/dev/null || true
          echo "--- xray-core 版本 ---"
          grep -m1 "^PKG_VERSION" feeds/helloworld/xray-core/Makefile 2>/dev/null || true

      - name: 下载源码
        working-directory: openwrt
        run: make download -j"$(nproc)"

      - name: 编译
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: 整理产物 + sha256
        working-directory: openwrt
        run: |
          mkdir -p /tmp/out
          cp -v bin/targets/ramips/mt7621/*msg1500* /tmp/out/ 2>/dev/null || true
          cp -v bin/targets/ramips/mt7621/sha256sums /tmp/out/ 2>/dev/null || true
          ls -lh /tmp/out/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: msg1500-x00-lede-fw
          path: /tmp/out/*
          if-no-files-found: error

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msg1500-x00-build-logs
          path: |
            openwrt/logs/**
            openwrt/.config
