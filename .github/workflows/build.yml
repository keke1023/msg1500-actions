name: Build MSG1500 X.00 (ImmortalWrt 21.02)

on:
  workflow_dispatch:
    inputs:
      wifi_driver:
        description: "MT7615 无线驱动"
        required: false
        default: "mt7615d"
        type: choice
        options:
          - mt7615d   # 闭源 mt_wifi（来自 coolsnowwolf/lede 固定 commit e698151）
          - mt7615e   # 开源 mt76（ImmortalWrt 默认，兜底用）
  # push:
  #   branches: [ main, master ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # ---- 底座与源（可按需调整）----
  IWRT_BRANCH: openwrt-21.02
  HELLOWORLD_BRANCH: master
  # openwrt/packages 的分支，lang/golang 取自这里。
  # master = Go 1.27（xray-core 26.x 要求 go >= 1.26 且 GOTOOLCHAIN=local）
  GOLANG_REF: master
  # coolsnowwolf/lede 固定 commit（2023-04-02）：
  # package/lean/mt 含 drivers/mt7615d + luci-app-mtwifi，兼容内核 5.4/5.10，
  # 与 ImmortalWrt 21.02 的 ramips 5.4 内核同代
  LEDE_PIN: e69815120ad5d1b5e9b1aa4c98d69e6ce6e8f3b4
  TZ: Asia/Shanghai

jobs:
  build:
    name: ramips/mt7621 · raisecom_msg1500-x-00
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 磁盘清理
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                       /usr/local/share/boost /usr/local/share/chromium /usr/local/julia* 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl ca-certificates

      - name: 拉取 ImmortalWrt (${{ env.IWRT_BRANCH }})
        run: |
          git clone --depth 1 -b "$IWRT_BRANCH" https://github.com/immortalwrt/immortalwrt.git openwrt
          git -C openwrt log -1 --format="ImmortalWrt HEAD: %H %cd" --date=iso

      - name: 添加 helloworld feed (master)
        run: bash scripts/10-add-feeds.sh

      - name: 升级 golang (openwrt/packages master → Go 1.27)
        run: bash scripts/20-golang-upgrade.sh

      - name: 剔除 rust 相关包
        run: bash scripts/30-remove-rust.sh

      - name: 注入 MT7615 闭源驱动 (lede 固定 commit)
        if: ${{ github.event.inputs.wifi_driver != 'mt7615e' }}
        run: bash scripts/40-mt7615d.sh

      - name: 安装全部 feeds
        working-directory: openwrt
        run: ./scripts/feeds install -a

      - name: 写入 .config 并 defconfig
        working-directory: openwrt
        run: |
          cp ../config/msg1500-x00.config .config
          make defconfig

      - name: 校验配置（设备 / rust / 驱动 / 版本）
        working-directory: openwrt
        run: |
          set -e
          grep -q "^CONFIG_TARGET_ramips_mt7621_DEVICE_raisecom_msg1500-x-00=y" .config \
            || { echo "!! 目标设备未选中"; exit 1; }
          if grep -E "^CONFIG_PACKAGE_.*([Rr]ust|shadow-tls)=y" .config; then
            echo "!! 仍有 rust 相关包被选中"; exit 1
          fi
          echo "--- 已选中的关键包 ---"
          grep -E "^CONFIG_PACKAGE_(luci-app-ssr-plus|luci-app-frpc|luci-app-ngrokc|xray-core|kmod-mt7615[de]|luci-app-mtwifi)=" .config || true
          echo "--- golang 版本 ---"
          grep -m1 "GO_DEFAULT_VERSION" feeds/packages/lang/golang/golang-values.mk
          echo "--- xray-core 版本 ---"
          grep -m1 "^PKG_VERSION" feeds/helloworld/xray-core/Makefile || true

      - name: 下载源码
        working-directory: openwrt
        run: make download -j"$(nproc)"

      - name: 编译
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: 整理产物 + sha256
        working-directory: openwrt
        run: |
          mkdir -p /tmp/out
          cp -v bin/targets/ramips/mt7621/*msg1500* /tmp/out/ 2>/dev/null || true
          cp -v bin/targets/ramips/mt7621/sha256sums /tmp/out/ 2>/dev/null || true
          ls -lh /tmp/out/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: msg1500-x00-iwrt2102-fw
          path: /tmp/out/*
          if-no-files-found: error

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msg1500-x00-build-logs
          path: |
            openwrt/logs/**
            openwrt/.config
